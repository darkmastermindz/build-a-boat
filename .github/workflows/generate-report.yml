name: Generate Boat Improvement Report

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Report version label (e.g. v1.1)"
        required: false
        default: "latest"
      notes:
        description: "Brief description of improvements made"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "raft-simulation.html"
      - "package.json"
      - "netlify.toml"
      - ".github/workflows/generate-report.yml"

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-report:
    name: Generate BOM & Improvement Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run model tests
        run: node --test tests/*.test.js

      - name: Generate Markdown report (fails on rule errors)
        id: report
        env:
          VERSION: ${{ github.event.inputs.version || 'latest' }}
          NOTES: ${{ github.event.inputs.notes || '' }}
        run: node scripts/generate-report.js "$VERSION" "$NOTES" --check

      - name: Commit report to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: generate boat improvement report [${{ github.event.inputs.version || 'latest' }}]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-improvement-report-${{ github.event.inputs.version || 'latest' }}
          path: reports/
          retention-days: 90

      - name: Print report summary
        if: always()
        run: |
          echo "### 🚣 BOB Improvement Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/latest-report.md >> $GITHUB_STEP_SUMMARY
